name: Perfect Planner CI

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: perfect-planner-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-release-gate:
    name: Windows build, tests, lint, and package
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Check out the exact commit
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Set up Rust with lint and formatting components
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Install browser test dependencies
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install chromium

      - name: Frontend typecheck and production build
        run: npm run build

      - name: Browser and integration regression
        run: npm run test:e2e

      - name: Rust formatting
        working-directory: src-tauri
        run: cargo fmt --all -- --check

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --all-targets

      - name: Rust lint with warnings denied
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Build Windows x64 MSI and NSIS candidates
        run: npm run tauri build
