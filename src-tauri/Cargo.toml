[package]
name = "perfect-planner-desktop"
version = "1.0.0"
description = "Perfect Planner Desktop Shell"
authors = ["Daniel Sivyer"]
edition = "2021"

[lib]
name = "perfect_planner_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
notify = "6.1"

[patch.crates-io]
schemars = { git = "https://github.com/GREsau/schemars", tag = "v0.8.21" }
schemars_derive = { git = "https://github.com/GREsau/schemars", tag = "v0.8.21" }
