[[permission]]
identifier = "allow-collision-assessor"
description = "Allows the main Perfect Planner window to issue, consume or revoke a run-bound, expiring, single-use native census capability."
commands.allow = [
  "collision_assessor_issue_discovery_capability",
  "collision_assessor_collect_census",
  "collision_assessor_revoke_discovery_capability"
]
